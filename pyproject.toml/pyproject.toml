[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtest-automation"
version = "0.3.0"
description = "Automated CFD pressure-test pipeline for piping system design"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "pyyaml>=6.0", "reportlab>=4.0"]

[project.scripts]
flowtest = "flowtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
